<script>
(() => {
'use strict';
const KEY='mhccl_v31e_ui_copy_accessibility_candidate_state';
const cats=['TOP','BOTTOM','DRESS','OUTER','HIJAB','SHOES','OTHER'];
const baseCats=new Set(['TOP','BOTTOM','DRESS','OUTER','OTHER']);
const q=new URLSearchParams(location.search);
const meta={experiment_id:q.get('experiment')||'outfit_first_v31d',variant_id:q.get('variant')||'v31e_ui_copy_accessibility_candidate',source_channel:q.get('source')||'direct',show_tools:q.get('tools')==='1'};
const uid=(p='id')=>p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
const now=()=>new Date().toISOString();
const fresh=()=>({version:'3.1e-ui-copy-accessibility-candidate',sessionId:uid('sess'),screen:'launch',garments:[],outfits:[],pairings:[],wearLogs:[],draft:null,pairEdit:null,noteEdit:null,events:[],filter:'all',matrixSeen:false,researchOpen:false,availEdit:false,availSavedId:null});
let storageOK=true;
function storageProbe(){try{const k='__mhccl_probe__';localStorage.setItem(k,'1');const ok=localStorage.getItem(k)==='1';localStorage.removeItem(k);return ok}catch(e){return false}}
storageOK=storageProbe();
let S=load();
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&x.version?x:fresh()}catch(e){storageOK=false;return fresh()}}
function devicePreflight(){const a=document.createElement('a');return {storage_ok:storageProbe(),protocol:location.protocol,user_agent:navigator.userAgent,viewport:`${innerWidth}x${innerHeight}`,device_pixel_ratio:devicePixelRatio||1,max_touch_points:navigator.maxTouchPoints||0,file_reader:typeof FileReader!=='undefined',canvas:!!document.createElement('canvas').getContext,blob:typeof Blob!=='undefined',object_url:!!(URL&&URL.createObjectURL),download_attribute:'download' in a,share_api:!!navigator.share,secure_context:window.isSecureContext};}

let storageWarned=false;function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true;return true}catch(e){storageOK=false;if(!storageWarned){storageWarned=true;setTimeout(()=>alert('This browser could not save prototype data. Stop this tester session; evidence recovery cannot be trusted on this device.'),0)}return false}}
function log(event,props={}){S.events.push({event,timestamp:now(),session_id:S.sessionId,experiment_id:meta.experiment_id,variant_id:meta.variant_id,source_channel:meta.source_channel,screen:S.screen,...props});save()}
function nav(screen,props={}){S.screen=screen;focusScreenAfterRender=true;if(screen==='matrix'&&!S.matrixSeen){S.matrixSeen=true;log('capsule_matrix_viewed',{piece_count:S.garments.length,outfit_count:S.outfits.length})}save();log('screen_view',{to:screen,...props});render();window.scrollTo(0,0)}
function esc(x=''){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
if(!window.CSS)window.CSS={};if(!CSS.escape)CSS.escape=x=>String(x).replace(/[^a-zA-Z0-9_-]/g,c=>'\\'+c);
function catName(c){return ({TOP:'Top',BOTTOM:'Bottom',DRESS:'Dress',OUTER:'Outer',HIJAB:'Hijab',SHOES:'Shoes',OTHER:'Other'})[c]||c}
function garmentName(g){return g.shortLabel||g.autoLabel||catName(g.category)}
function nextAutoLabel(category){const all=[...S.garments,...(S.draft?.draftGarments||[]),...(S.pairEdit?.draftHijabs||[])].filter(g=>g.category===category);let max=0;for(const g of all){const m=String(g.autoLabel||'').match(/(\d+)$/);if(m)max=Math.max(max,+m[1])}return catName(category)+' '+(max+1)}

function garmentBy(id){return S.garments.find(g=>g.id===id)}
function pairingHijabs(outfitId){return S.pairings.filter(p=>p.outfitId===outfitId).map(p=>garmentBy(p.hijabId)).filter(Boolean)}

function addFormDirty(){const f=S.addForm;return !!(S.addOpen&&f&&(f.category||String(f.shortLabel||'').trim()||f.imageData||f.photoPending))}
function pairEditDirty(){const pe=S.pairEdit;if(!pe)return false;return !!(pe.draftHijabs.length||String(pe.newHijabName||'').trim()||pe.newHijabPhoto||pe.photoPending||[...pe.selectedIds].sort().join('|')!==[...pe.originalIds].sort().join('|'))}
function noteEditDirty(){return !!(S.noteEdit&&S.noteEdit.value!==S.noteEdit.original)}
function outfitMembers(o){return outfitRelationMembers(o)}
function outfitAvailable(o){const base=o.garmentIds.map(garmentBy).filter(Boolean);if(base.some(g=>g.availability!=='AVAILABLE'))return false;const hs=pairingHijabs(o.id);return !hs.length||hs.some(h=>h.availability==='AVAILABLE')}
function imgHTML(g,cls='',decorative=false){if(g&&g.imageData)return `<img class="${cls}" src="${g.imageData}" alt="${decorative?'':esc(garmentName(g))}">`;return `<span ${decorative?'aria-hidden="true"':''}>${g?esc(garmentName(g)):''}</span>`}
function pieceCard(g,selected=false,onClick='',toggle=false,focusKey=''){const aria=toggle?` aria-pressed="${selected?'true':'false'}"`:'';const key=focusKey||`${toggle?'piece-toggle':'piece-action'}-${g.id}`;return `<button class="mini ${selected?'selected':''}" data-focus-key="${esc(key)}"${aria} ${onClick?`onclick="${onClick}"`:''}><div class="pic">${imgHTML(g,'',true)}</div><div class="lab">${esc(garmentName(g))}</div><span class="sr-only">${toggle?(selected?'Selected':'Not selected'):''}</span></button>`}
function compositionHTML(members){if(!members.length)return `<div class="empty-canvas"><div class="h3">Add the pieces in this outfit</div><div class="small">Only what you need right now.</div></div>`;const shown=members.length>5?members.slice(0,5):members;const overflow=members.length>5?`<div class="comp-piece"><div class="thumb">+${members.length-5}</div><div class="label">More pieces</div></div>`:'';return `<div class="composition-grid">${shown.map(g=>`<div class="comp-piece"><div class="thumb">${imgHTML(g)}</div><div class="label">${esc(garmentName(g))}</div></div>`).join('')}${overflow}</div>`}
function shell(inner,navBar=false){return `<div class="app-shell"><div class="screen"><div class="status-pad"></div>${inner}${navBar?navHTML():''}</div></div>`}
function navHTML(){return `<nav class="nav" aria-label="Primary"><button data-focus-key="nav-outfits" class="${S.screen==='home'?'active':''}" ${S.screen==='home'?'aria-current="page"':''} onclick="APP.go('home')"><span class="ico" aria-hidden="true">▤</span><span>Outfits</span></button><button data-focus-key="nav-capsule" class="${S.screen==='capsule'?'active':''}" ${S.screen==='capsule'?'aria-current="page"':''} onclick="APP.go('capsule')"><span class="ico" aria-hidden="true">▦</span><span>Capsule</span></button></nav>`}
function appbar(title,back=null,action=''){return `<div class="appbar">${back?`<button data-focus-key="appbar-back" class="icon-btn" onclick="${back}" aria-label="Back">‹</button>`:''}<h1 class="screen-title-focus" data-screen-title tabindex="-1">${esc(title)}</h1>${action||''}</div>`}
function launch(){return shell(`<main class="hero"><div class="hero-art" aria-hidden="true"><div class="shape top"></div><div class="shape skirt"></div><div class="shape hijab"></div></div><h1 class="h1 screen-title-focus" data-screen-title tabindex="-1">Remember outfits<br>that already work.</h1><p class="body">Start with one outfit you already wear. Add only the pieces you need.</p><p class="small">No need to upload your whole wardrobe.</p>${preflightBanner()}</main><div class="cta-wrap"><button data-focus-key="launch-start" class="btn" ${storageOK?'':'disabled'} onclick="APP.startFirst()">Save my first outfit</button></div>`) }
function ensureDraft(){if(!S.draft)S.draft={id:uid('draft'),existingIds:[],draftGarments:[],startedAt:now()}}
function builder(){ensureDraft();const n=S.outfits.length+1;const title=n===1?'First outfit':n===2?'Second outfit':n===3?'Third outfit':'New outfit';const intro=n===1?'Think of an outfit you already wear and want to remember.':'Reuse anything that works, and add only what\'s missing.';const existingSelected=S.draft.existingIds.map(garmentBy).filter(Boolean);const drafts=S.draft.draftGarments;const members=[...existingSelected,...drafts];const existing=S.garments;const valid=members.some(g=>baseCats.has(g.category));const saveLabel=n===1?'Save first outfit':'Save outfit';const helper=!valid&&members.length?`<div id="save-prereq" class="cta-help">Add at least one main clothing piece before saving.</div>`:'';return shell(`${appbar(title,"APP.backFromBuilder()")}
<div class="builder-intro"><div class="body">${intro}</div></div>
<div class="canvas">${compositionHTML(members)}</div>
${existing.length?`<div class="section"><div class="section-head"><div class="section-title">Use a piece you've already added</div><button data-focus-key="builder-add-top" class="text-action" onclick="APP.openAdd()">+ Add new</button></div><div class="rail">${existing.map(g=>pieceCard(g,S.draft.existingIds.includes(g.id),`APP.toggleExisting('${g.id}')`,true,`existing-${g.id}`)).join('')}<button data-focus-key="builder-add-card" class="mini addnew" onclick="APP.openAdd()">+ Add new piece</button></div></div>`:`<div class="section"><button data-focus-key="builder-add-primary" class="btn tonal" onclick="APP.openAdd()">+ Add a piece</button></div>`}
${drafts.length?`<div class="section"><div class="section-title" style="margin-bottom:8px">New in this outfit · draft</div><div class="draft-strip">${drafts.map(g=>`<div class="draft-chip"><span>${esc(g.shortLabel||catName(g.category))}</span><button data-focus-key="draft-edit-${g.id}" onclick="APP.editDraft('${g.id}')" aria-label="Edit ${esc(garmentName(g))} in this draft">Edit</button><button data-focus-key="draft-remove-${g.id}" onclick="APP.removeDraft('${g.id}')" aria-label="Remove ${esc(garmentName(g))} from this draft">×</button></div>`).join('')}</div></div>`:''}
<div class="cta-wrap">${helper}<button data-focus-key="builder-save" class="btn" ${valid?'':`disabled ${members.length?'aria-describedby="save-prereq"':''}`} onclick="APP.saveDraftOutfit()">${saveLabel}</button></div>${S.addOpen?addSheet():''}`)}
function addSheet(prefill=''){const form=S.addForm||{category:prefill||'',shortLabel:'',imageData:'',photoToken:'',photoPending:false,editDraftId:null,editSnapshot:null};S.addForm=form;const editing=!!form.editDraftId;const same=form.category?S.garments.filter(g=>g.category===form.category):[];const photoText=form.photoPending?'Processing photo…':form.imageData?'Replace local photo':'Choose local photo';return `<div class="scrim" aria-hidden="true" onclick="APP.closeAdd()"></div><section id="add-piece-dialog" class="sheet" role="dialog" aria-modal="true" aria-labelledby="add-piece-title" onclick="event.stopPropagation()"><div class="handle" aria-hidden="true"></div><h2 id="add-piece-title" data-dialog-title tabindex="-1" class="h3">${editing?'Edit draft piece':'Add a piece'}</h2><div class="small" style="margin-top:4px">Choose a category. Photo and short name are optional.</div><div class="cat-grid" role="group" aria-label="Piece category">${cats.map(c=>`<button data-focus-key="add-cat-${c}" class="cat ${form.category===c?'active':''}" aria-pressed="${form.category===c?'true':'false'}" onclick="APP.pickCat('${c}')">${catName(c)}</button>`).join('')}</div>${!editing&&same.length?`<div class="same-cat"><div class="small"><strong>Already added?</strong> Reuse one of these instead.</div><div class="rail">${same.map(g=>pieceCard(g,false,`APP.reuseFromAdd('${g.id}')`,false,`reuse-${g.id}`)).join('')}</div></div>`:''}<div class="form-divider"></div><div class="field"><label for="pieceShortName">Short name · optional</label><input data-focus-key="piece-short-name" id="pieceShortName" maxlength="40" placeholder="e.g. White blouse" value="${esc(form.shortLabel)}" oninput="APP.setAddLabel(this.value)"></div><div class="field"><span class="field-label" style="font-size:13px;font-weight:750;color:#4B4F49">Photo · optional</span><label class="filebox">${form.photoPending?`<span role="status" aria-live="polite">${photoText}</span>`:photoText}<input data-focus-key="piece-photo" type="file" accept="image/*" ${form.photoPending?'disabled':''} onchange="APP.photo(this.files[0])"></label>${form.imageData?`<div style="display:flex;align-items:center;gap:10px;margin-top:8px"><div class="pair-thumb">${imgHTML({imageData:form.imageData,shortLabel:'Selected photo'},'',true)}</div><button data-focus-key="piece-photo-remove" class="text-action" onclick="APP.removeAddPhoto()">Remove photo</button></div>`:''}</div><div class="sheet-actions"><button data-focus-key="add-cancel" class="btn outline" onclick="APP.closeAdd()">Cancel</button><button data-focus-key="add-submit" class="btn" ${form.category&&!form.photoPending?'':'disabled'} onclick="APP.addDraftGarment()">${editing?'Done':'Add to outfit'}</button></div></section>`}
function success(){const o=S.outfits[S.outfits.length-1];const n=S.outfits.length;const members=outfitDisplayMembers(o);const title=n===1?'First outfit saved':n===2?'Two outfits saved':n===3?'Three outfits saved':'Outfit saved';let msg=n===1?'You can come back to this combination anytime.':n===2?'Your captured pieces are ready to reuse again.':n===3?'Your Capsule Matrix is ready if you want to see it.':'Saved.';if(n===2){const a=new Set(outfitRelationMembers(S.outfits[0]).map(g=>g.id));const reuse=members.filter(g=>a.has(g.id)).length;if(reuse)msg=`You reused ${reuse} piece${reuse>1?'s':''} across both outfits.`}
const next=n<3?`<button class="btn tonal" onclick="APP.afterSuccess()">${n===1?'Save another outfit':'Save one more outfit'}</button>`:`<button class="btn tonal" onclick="APP.viewMatrixFromSuccess()">View Capsule Matrix</button>`;return shell(`${appbar('Saved')}
<div class="success-card"><div class="h2">${title}</div><div class="small" style="margin-top:6px">${msg}</div><div class="success-visual">${compositionHTML(members)}</div></div><div class="section" style="display:grid;gap:10px;padding-bottom:36px"><button class="btn tonal" onclick="APP.doneForNow()">Done for now</button>${next}</div>`)}
function relationTable(pairOnly=false,surface='stable'){const outfits=S.outfits;const gs=pairOnly?S.garments.filter(g=>g.category==='HIJAB'):S.garments.filter(g=>outfits.some(o=>outfitMembers(o).some(m=>m.id===g.id)));const cols=outfits.length||1;const suffix=pairOnly?'pairing':surface;const captionId=`relation-caption-${suffix}`;const caption=pairOnly?`Hijab Pairing: saved hijab options across ${outfits.length} outfits`:`${surface==='activation'?'Capsule Matrix':'Capsule'}: saved piece participation across ${outfits.length} outfits`;return `<div class="relation-scroll" data-scroll-region aria-labelledby="${captionId}"><table class="relation-table" style="--cols:${cols}"><caption id="${captionId}" class="sr-only">${esc(caption)}</caption><thead><tr><th scope="col" style="text-align:start">${pairOnly?'Hijab':'Piece'}</th>${outfits.map((o,i)=>`<th scope="col">Outfit ${i+1}</th>`).join('')}</tr></thead><tbody>${gs.map(g=>`<tr><th scope="row"><span class="relation-row-head"><span class="piece-icon" aria-hidden="true">${imgHTML(g,'',true)}</span><span class="relation-row-copy"><span class="piece-name">${esc(garmentName(g))}</span>${pairOnly?`<span class="relation-secondary">${g.availability==='AVAILABLE'?'Available':g.availability==='LAUNDRY'?'Laundry':'Temporarily unavailable'}</span>`:''}</span></span></th>${outfits.map(o=>{const hit=pairOnly?S.pairings.some(p=>p.outfitId===o.id&&p.hijabId===g.id):outfitMembers(o).some(m=>m.id===g.id);const spoken=pairOnly?(hit?'Saved option':'Not saved option'):(hit?'Saved':'Not saved');return `<td>${hit?'<span class="mark" aria-hidden="true">✓</span>':'<span class="empty-cell" aria-hidden="true"></span>'}<span class="sr-only">${spoken}</span></td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}
function matrix(reveal=true){const reused=findReusable();return shell(`${appbar('Capsule Matrix')}
<div style="padding:10px 16px 8px"><div class="micro">Capsule Matrix</div><h2 class="h2" style="margin:4px 0 0">See your saved combinations together</h2><div class="small" style="margin-top:4px">${S.garments.length} pieces across ${S.outfits.length} saved outfits</div></div>${relationTable(false,'activation')}${reused?`<div class="insight">${esc(garmentName(reused.g))} appears in ${reused.count} saved outfits.</div>`:''}<div class="section"><div class="small">✓ marks a piece that belongs to an outfit you saved.</div></div>${reveal?`<div class="cta-wrap"><button data-focus-key="matrix-continue" class="btn" onclick="APP.finishMatrix()">Continue to my outfits</button></div>`:''}`,!reveal)}
function findReusable(){let best=null;for(const g of S.garments){const count=S.outfits.filter(o=>outfitMembers(o).some(m=>m.id===g.id)).length;if(count>1&&(!best||count>best.count))best={g,count}}return best}
function home(){const filtered=S.filter==='available'?S.outfits.filter(outfitAvailable):S.outfits;return shell(`${appbar('Outfits',null,`<button data-focus-key="home-save" class="top-action" onclick="APP.newOutfit()">＋ Save</button>${meta.show_tools?'<button data-focus-key="home-tools" class="icon-btn" aria-label="Open test tools" onclick="APP.openResearch()">⋮</button>':''}`)}<div style="padding:0 16px"><div class="small">${S.outfits.length} saved outfit${S.outfits.length===1?'':'s'}</div></div><div class="filters" role="group" aria-label="Outfit availability filter"><button data-focus-key="filter-all" class="filter ${S.filter==='all'?'active':''}" aria-pressed="${S.filter==='all'?'true':'false'}" onclick="APP.setFilter('all')">All</button><button data-focus-key="filter-available" class="filter ${S.filter==='available'?'active':''}" aria-pressed="${S.filter==='available'?'true':'false'}" onclick="APP.setFilter('available')">Available now</button></div><div class="outfit-list">${filtered.length?filtered.map(outfitCard).join(''):`<div class="empty-state"><h2 class="h3">No saved outfits are fully available right now.</h2><div class="small" style="margin-top:8px">Update availability or view all saved outfits.</div><button data-focus-key="empty-view-all" class="btn tonal" style="margin-top:18px" onclick="APP.setFilter('all')">View all saved outfits</button></div>`}</div>`,true)}
function outfitCard(o){const preferAvailable=S.filter==='available';const display=outfitDisplayMembers(o,preferAvailable);const base=outfitBaseMembers(o);const hs=pairingHijabs(o.id);const rep=representativeHijab(o.id),shownHijab=contextualHijab(o.id,preferAvailable);const available=outfitAvailable(o);const switched=preferAvailable&&available&&rep&&shownHijab&&rep.id!==shownHijab.id;const countText=hs.length>1?`${base.length} base piece${base.length===1?'':'s'} · ${hs.length} hijab options`:`${display.length} piece${display.length===1?'':'s'}`;const availabilityText=available?'Available now':'Not fully available';return `<button data-focus-key="outfit-${o.id}" aria-label="Open ${esc(o.name||'saved outfit')}. ${esc(countText)}. ${availabilityText}." class="outfit-wide ${available?'':'muted-card'}" onclick="APP.openOutfit('${o.id}')" style="text-align:left;color:inherit"><div class="visual">${compositionHTML(display)}</div><div class="meta"><div style="font-size:16px;font-weight:750">${esc(o.name||'Saved outfit')}</div><div class="small" style="margin-top:5px">${countText}</div><div class="small" style="margin-top:3px;font-weight:750;color:${available?'var(--primary)':'var(--muted)'}">${availabilityText}</div>${hs.length>1?`<div class="badge">${switched?'Available hijab shown':'Alternatives saved'}</div>`:''}</div></button>`}
function capsule(){const hasAlt=S.outfits.some(o=>pairingHijabs(o.id).length>1);return shell(`${appbar('Capsule',null,hasAlt?`<button data-focus-key="capsule-pairing" class="top-action" onclick="APP.go('pairMatrix')">Hijab pairing</button>`:'')}<div style="padding:0 16px 12px"><div class="small">${S.garments.length} pieces · ${S.outfits.length} outfits</div></div>${relationTable(false,'stable')}<div class="section"><div class="small">✓ marks a piece that belongs to an outfit you saved.</div></div>${hasAlt?`<div class="insight">Hijab Pairing is available because you have saved alternative hijabs.</div>`:''}`,true)}
function detail(){const o=S.outfits.find(x=>x.id===S.currentOutfitId)||S.outfits[0];if(!o)return home();const hs=pairingHijabs(o.id);return shell(`${appbar(o.name||'Outfit',"APP.go('home')")}
<div class="detail-visual">${compositionHTML(outfitDisplayMembers(o))}</div>
${hs.length||S.garments.some(g=>g.category==='HIJAB')?`<div class="section"><div class="section-head"><div><h2 class="h3" style="margin:0">Hijab options</h2><div class="small">Hijabs you already wear with this outfit.</div></div><button data-focus-key="detail-hijab" class="text-action" onclick="APP.openPairEdit('${o.id}')">${hs.length?'Edit':'+ Add'}</button></div>${hs.length?`<div class="hijab-options">${hs.map(h=>`<div class="hopt"><div class="img">${imgHTML(h,'',true)}<span class="check" aria-hidden="true">✓</span></div><div class="name">${esc(garmentName(h))}</div><div class="state">${h.availability==='AVAILABLE'?'Available':h.availability==='LAUNDRY'?'Laundry':'Unavailable'}</div></div>`).join('')}</div>`:`<div class="small">No saved hijab options yet.</div>`}</div>`:''}
<div class="section"><div class="list-row"><span>Availability</span><button data-focus-key="detail-availability" class="text-action" onclick="APP.manageAvailability('${o.id}')">Manage</button></div><div class="list-row"><span>Practical note</span><button data-focus-key="detail-note" class="text-action" onclick="APP.editNote('${o.id}')">${o.practicalNote?'Edit':'Add'}</button></div>${o.practicalNote?`<div class="small" style="padding:0 0 12px">${esc(o.practicalNote)}</div>`:''}</div>${S.pairEdit?pairSheet():''}${S.availEdit?availabilitySheet(o):''}${S.noteEdit?noteSheet():''}`,false)}
function pairSheet(){const hijabs=S.garments.filter(g=>g.category==='HIJAB');const title=S.pairEdit.originalIds.length?'Edit hijab options':'Add hijab options';return `<div class="scrim" aria-hidden="true" onclick="APP.cancelPairEdit()"></div><section id="hijab-options-dialog" class="sheet" role="dialog" aria-modal="true" aria-labelledby="hijab-options-title" onclick="event.stopPropagation()"><div class="handle" aria-hidden="true"></div><h2 id="hijab-options-title" data-dialog-title tabindex="-1" class="h3">${title}</h2><div class="small" style="margin-top:4px">Select any hijabs you already wear with this outfit.</div><div class="pair-list">${hijabs.map(h=>{const on=S.pairEdit.selectedIds.includes(h.id);const was=S.pairEdit.originalIds.includes(h.id);const draftState=was?(on?'Saved option':'Will be removed'):(on?'Selected · not saved yet':'');const label=on?`Deselect ${garmentName(h)} as a hijab option`:`Select ${garmentName(h)} as a hijab option`;return `<div class="pair-row"><div class="pair-thumb">${imgHTML(h,'',true)}</div><div class="pair-meta"><div class="pair-name">${esc(garmentName(h))}</div><div class="pair-state">${h.availability==='AVAILABLE'?'Available':h.availability==='LAUNDRY'?'Laundry':'Unavailable'}${draftState?` · ${draftState}`:''}</div></div><button data-focus-key="pair-toggle-${h.id}" aria-label="${esc(label)}" aria-pressed="${on?'true':'false'}" class="pair-check ${on?'on':''}" onclick="APP.togglePair('${h.id}')">${on?'✓':''}</button></div>`}).join('')}${S.pairEdit.draftHijabs.map(h=>`<div class="pair-row"><div class="pair-thumb">${imgHTML(h,'',true)}</div><div class="pair-meta"><div class="pair-name">${esc(h.shortLabel||'New hijab')}</div><div class="pair-state">New · draft · selected</div></div><button data-focus-key="pair-draft-remove-${h.id}" class="text-action" onclick="APP.removePairDraft('${h.id}')">Remove</button></div>`).join('')}<div class="pair-row"><button data-focus-key="pair-add-new" class="text-action" onclick="APP.showNewHijabForm()">＋ Add new hijab</button></div></div>${S.pairEdit.newHijabForm?newHijabForm():''}<div class="sheet-actions"><button data-focus-key="pair-cancel" class="btn outline" onclick="APP.cancelPairEdit()">Cancel</button><button data-focus-key="pair-done" class="btn" onclick="APP.commitPairEdit()">Done</button></div></section>`}
function newHijabForm(){const pe=S.pairEdit;const photoText=pe.photoPending?'Processing photo…':pe.newHijabPhoto?'Replace local photo':'Choose local photo';return `<div class="form-divider"></div><h3 class="h3">New hijab</h3><div class="field"><label for="newHijabName">Short name · optional</label><input data-focus-key="new-hijab-name" id="newHijabName" maxlength="40" placeholder="e.g. Olive hijab" value="${esc(pe.newHijabName||'')}" oninput="APP.setPairDraftName(this.value)"></div><div class="field"><span style="font-size:13px;font-weight:750;color:#4B4F49">Photo · optional</span><label class="filebox">${pe.photoPending?`<span role="status" aria-live="polite">${photoText}</span>`:photoText}<input data-focus-key="new-hijab-photo" type="file" accept="image/*" ${pe.photoPending?'disabled':''} onchange="APP.pairPhoto(this.files[0])"></label>${pe.newHijabPhoto?`<div style="display:flex;align-items:center;gap:10px;margin-top:8px"><div class="pair-thumb">${imgHTML({imageData:pe.newHijabPhoto,shortLabel:'Selected hijab photo'},'',true)}</div><button data-focus-key="new-hijab-photo-remove" class="text-action" onclick="APP.removePairPhoto()">Remove photo</button></div>`:''}</div><button data-focus-key="new-hijab-add" class="btn tonal" style="margin-top:12px" ${pe.photoPending?'disabled':''} onclick="APP.addPairDraftHijab()">Add new hijab</button>`}

abs.push(h);S.pairEdit.newHijabForm=false;S.pairEdit.newHijabName='';S.pairEdit.newHijabPhoto='';S.pairEdit.photoToken='';S.pairEdit.photoPending=false;save();render()},removePairDraft(id){S.pairEdit.draftHijabs=S.pairEdit.draftHijabs.filter(h=>h.id!==id);save();render()},commitPairEdit(){const pe=S.pairEdit,o=pe.outfitId;if(pe.originalIds.length&&pe.selectedIds.length===0&&pe.draftHijabs.length===0&&!confirm('Keep this outfit without a saved hijab?'))return;const before=JSON.stringify(S);const oldSet=new Set(pe.originalIds),newSet=new Set(pe.selectedIds);const removed=[...oldSet].filter(id=>!newSet.has(id)),added=[...newSet].filter(id=>!oldSet.has(id));S.pairings=S.pairings.filter(p=>p.outfitId!==o||newSet.has(p.hijabId));for(const id of added){if(!S.pairings.some(p=>p.outfitId===o&&p.hijabId===id))S.pairings.push({id:uid('p'),outfitId:o,hijabId:id,source:'ADDED_LATER',createdAt:now()})}for(const dh of pe.draftHijabs){const g={...dh,id:uid('g')};S.garments.push(g);S.pairings.push({id:uid('p'),outfitId:o,hijabId:g.id,source:'ADDED_LATER',createdAt:now()})}const changed=added.length||removed.length||pe.draftHijabs.length;S.pairEdit=null;if(!save()){S=JSON.parse(before);render();alert('Hijab changes were not saved. Your unsaved changes are still open in this session.');return}if(changed){log('hijab_pairing_changed',{outfit_id:o,existing_added_count:added.length,removed_count:removed.length,new_hijab_count:pe.draftHijabs.length});if(added.length||pe.draftHijabs.length)log('hijab_pairing_used',{outfit_id:o,new_hijab:pe.draftHijabs.length>0,added_count:added.length+pe.draftHijabs.length})}render()},
editNote(id){const o=S.outfits.find(x=>x.id===id);S.noteEdit={outfitId:id,value:o?.practicalNote||'',original:o?.practicalNote||''};save();render()},setNoteDraft(v){if(S.noteEdit){S.noteEdit.value=v;save()}},cancelNote(){if(!S.noteEdit)return;if(noteEditDirty()&&!confirm('Discard unsaved note changes?'))return;S.noteEdit=null;save();render()},saveNote(){if(!S.noteEdit)return;const o=S.outfits.find(x=>x.id===S.noteEdit.outfitId);if(!o)return;const old=o.practicalNote;o.practicalNote=S.noteEdit.value.trim();if(!save()){o.practicalNote=old;render();return}log('practical_note_used',{outfit_id:o.id,has_note:!!o.practicalNote});S.noteEdit=null;save();render()},manageAvailability(id){S.availEdit=true;S.availSavedId=null;save();render()},closeAvailability(){S.availEdit=false;S.availSavedId=null;save();render()},setAvailability(id,v){const g=garmentBy(id);if(!g)return;const old=g.availability;g.availability=v;S.availSavedId=null;if(!save()){g.availability=old;render();return}S.availSavedId=id;log('availability_state_used',{garment_id:id,state:v});log('availability_saved',{garment_id:id,state:v});save();render()},
openResearch(){if(!meta.show_tools)return;S.researchOpen=true;save();render()},closeResearch(){S.researchOpen=false;save();render()},logDevicePreflight(){const d=devicePreflight();log('device_preflight',d);render()},exportJSON(){const payload=sanitizedEvidencePayload();const ok=download(`mhccl_${S.sessionId}_evidence_sanitized.json`,JSON.stringify(payload,null,2));log(ok?'evidence_export_started':'evidence_export_failed',{format:'json',sanitized:true});if(!ok)alert('Evidence export could not be started. Product state was not changed. Try again before ending this test session.')},exportCSV(){const preferred=['event','timestamp','session_id','experiment_id','variant_id','source_channel','screen'];const extras=[...new Set(S.events.flatMap(e=>Object.keys(e)).filter(k=>!preferred.includes(k)))].sort();const cols=[...preferred,...extras];const lines=[cols.join(',')];for(const e of S.events)lines.push(cols.map(k=>'"'+String(e[k]??'').replaceAll('"','""')+'"').join(','));const ok=download(`mhccl_${S.sessionId}_events.csv`,lines.join('\\n'),'text/csv');log(ok?'evidence_export_started':'evidence_export_failed',{format:'csv',sanitized:true});if(!ok)alert('CSV export could not be started. Product state was not changed. Try again before ending this test session.')},newTestSession(){if(confirm('Start a new test session and clear all local prototype data?')){localStorage.removeItem(KEY);S=fresh();render()}},resetAll(){APP.newTestSession()},
