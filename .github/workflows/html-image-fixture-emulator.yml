name: html-image-fixture-emulator

on:
  workflow_dispatch:
  push:
    branches:
      - android-test-implementation-v0.1
    paths:
      - "prototype/index.html"
      - "android/**"
      - "tests/image-fixtures/**"
      - ".github/workflows/html-image-fixture-emulator.yml"

permissions:
  contents: read

jobs:
  image-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install deterministic fixture/test dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow==12.3.0 websocket-client==1.8.0

      - name: Generate and verify synthetic image fixtures
        run: |
          python tests/image-fixtures/generate_fixtures.py \
            --out build/image-fixtures \
            --expected tests/image-fixtures/FIXTURE_MANIFEST.json

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"
          cache-provider: basic

      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1 || true)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Verify canonical HTML and build debug shell
        working-directory: android
        run: |
          gradle :androidApp:verifyPrototypeSha :androidApp:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run exact-HTML image lifecycle on API 36 emulator
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python tests/image-fixtures/emulator_photo_lifecycle.py --apk android/androidApp/build/outputs/apk/debug/androidApp-debug.apk --fixtures build/image-fixtures --evidence build/image-emulator-evidence

      - name: Upload replayable image fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mhccl-image-fixtures-v1
          path: build/image-fixtures
          if-no-files-found: error

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mhccl-html-image-emulator-evidence
          path: build/image-emulator-evidence
          if-no-files-found: warn
