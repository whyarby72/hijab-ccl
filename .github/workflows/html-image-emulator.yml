name: html-image-emulator

on:
  workflow_dispatch:
  push:
    branches:
      - html-image-fixture-emulator-v0.1
    paths:
      - "tests/image-fixtures/run_emulator_flow.sh"
      - ".github/workflows/html-image-emulator.yml"

permissions:
  contents: read

jobs:
  emulator-image-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout fixture branch
        uses: actions/checkout@v6
        with:
          path: fixture-src

      - name: Checkout Android TEST host branch
        uses: actions/checkout@v6
        with:
          ref: android-test-implementation-v0.1
          path: android-src

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.4.1"

      - name: Generate deterministic fixtures
        run: python3 fixture-src/tests/image-fixtures/generate_fixtures.py

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run API 36 emulator image lifecycle
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash fixture-src/tests/image-fixtures/run_emulator_flow.sh android-src fixture-src

      - name: Upload sanitized emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mhccl-html-image-emulator-evidence
          path: fixture-src/evidence/html-image-fixture-emulator/
          if-no-files-found: warn
