name: android-apk-emulator-parity-g1

on:
  workflow_dispatch:
  push:
    branches:
      - android-test-implementation-v0.1
    paths:
      - "android/**"
      - "prototype/index.html"
      - "tests/android-parity/**"
      - "tests/image-fixtures/**"
      - ".github/workflows/android-apk-emulator-parity-g1.yml"

permissions:
  contents: read

jobs:
  android-apk-parity-g1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout proven image-fixture source
        uses: actions/checkout@v6
        with:
          ref: eacfd37ac5ad4764ae0a309cc2fd7458531b8770
          path: proven-fixture-src

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install fixture/runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow==12.3.0 websocket-client==1.8.0

      - name: Generate deterministic image fixtures
        run: |
          python tests/image-fixtures/generate_fixtures.py \
            --out build/image-fixtures \
            --expected tests/image-fixtures/FIXTURE_MANIFEST.json

      - name: Generate proven PNG fixture pack
        run: |
          python proven-fixture-src/tests/image-fixtures/generate_fixtures.py

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"
          cache-provider: basic

      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1 || true)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Verify canonical candidate and build APK
        working-directory: android
        run: |
          gradle :androidApp:verifyPrototypeSha :androidApp:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android APK parity G1 on API 36 emulator
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python tests/android-parity/emulator_apk_parity_g1.py --apk android/androidApp/build/outputs/apk/debug/androidApp-debug.apk --prototype prototype/index.html --fixtures proven-fixture-src/tests/image-fixtures/generated --evidence build/android-apk-parity-g1

      - name: Upload G1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mhccl-android-apk-emulator-parity-g1
          path: build/android-apk-parity-g1
          if-no-files-found: warn

      - name: Upload exact debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mhccl-android-g1-debug-apk
          path: android/androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error
